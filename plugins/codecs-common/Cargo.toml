[package]
name = "schist-codecs-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schist-fx.workspace = true
schist-i18n.workspace = true
schist-core.workspace = true
# The page layout codec, registered behind the same feature flag as Design
# Mode. It is a dependency rather than a plugin like the others because it
# reads a different document type and so cannot share `CodecPlugin`.
schist-codec-idml.workspace = true
# Native InDesign documents, read through the IDML importer. Registered
# behind the same feature flag.
schist-codec-indd.workspace = true
schist-app-settings.workspace = true
schist-codec-psd.workspace = true
schist-plugin-api.workspace = true
schist-codec-affinity.workspace = true
anyhow.workspace = true
log.workspace = true
image.workspace = true
miniz_oxide.workspace = true
# Nesting check on OpenRaster and Krita layer trees before they are built.
quick-xml = "0.41"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
half = "2"
exr.workspace = true
sha2 = "0.10"
schist-color.workspace = true
schist-colormgmt.workspace = true
schist-compositor.workspace = true
# Camera raws are pure Rust and use the same implementation on desktop
# and wasm.
schist-codec-raw.workspace = true
# JPEG XL and AVIF (see src/jxl.rs, src/avif.rs). moxcms renders an
# XYB-coded JPEG XL into its ICC profile, and builds profiles for AVIF's
# nclx colour spaces.
jxl-oxide = { workspace = true, features = ["moxcms"] }
zune-jpegxl.workspace = true
zune-core.workspace = true
rav1e.workspace = true
moxcms = "0.8"

# Threads where there are threads: the browser build has none to give.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jxl-oxide = { workspace = true, features = ["rayon"] }
zune-jpegxl = { workspace = true, features = ["threads"] }
rav1e = { workspace = true, features = ["threading"] }
# rav1d leans on C integer types the libc crate does not define for
# wasm32, so the browser build exports AVIF but cannot open it.
rav1d.workspace = true
libc = "0.2"

# HEIC rides on a dlopen'd libheif; a browser has neither dlopen nor a
# libheif to open, so the codec (and its loader) stay off the wasm build.
# iOS forbids dlopen too, and has no need of it: ImageIO decodes HEIC.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
libloading.workspace = true

# The ImageIO decoder behind HEIC on iOS (see src/heif_imageio.rs).
[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "=0.10.0"
core-graphics = "0.24"
foreign-types = "0.5"

[dev-dependencies]
crc32fast.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(schist_library)"] }
