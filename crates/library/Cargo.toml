[package]
name = "schist-library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Instance-owned Schist editing and People APIs for C and WebAssembly"

[lib]
name = "schist"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
base64 = "0.22"
schist-core.workspace = true
schist-i18n.workspace = true
schist-plugin-api.workspace = true
schist-mcp = { path = "../mcp", default-features = false }
schist-document.workspace = true
schist-neural.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
tempfile = "3"
