# Flatpak manifest. Build with:
#   flatpak-builder --user --install build packaging/linux/com.infrawrench.schist.yaml
app-id: com.infrawrench.schist
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: schist
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  # Schist only touches files the user picks through the portal.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/schist/cargo
modules:
  - name: libgphoto2
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-docs
    sources:
      - type: archive
        url: https://github.com/gphoto/libgphoto2/releases/download/v2.5.34/libgphoto2-2.5.34.tar.bz2
        sha256: 5df9e774eb4ab6087a193afff84dcafe9f666e3443fe29e73e6779f659ff7f28
  - name: schist
    buildsystem: simple
    build-commands:
      - cargo --offline build --release -p schist-app
      - install -Dm755 target/release/schist /app/bin/schist
      - install -Dm644 packaging/linux/schist.desktop
          /app/share/applications/com.infrawrench.schist.desktop
      - install -Dm644 packaging/linux/com.infrawrench.schist.mime.xml
          /app/share/mime/packages/com.infrawrench.schist.xml
      - install -Dm644 packaging/linux/schist.png
          /app/share/icons/hicolor/256x256/apps/com.infrawrench.schist.png
    sources:
      - type: dir
        path: ../..
